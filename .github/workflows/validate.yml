name: validate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifests:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: plugin.json ↔ marketplace.json agree (name / version / description / field types)
        run: python3 scripts/validate_plugin.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Claude Code schema check (claude plugin validate)
        run: npx --yes @anthropic-ai/claude-code plugin validate .

      - name: Tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error file=.claude-plugin/plugin.json::tag ${GITHUB_REF_NAME} does not match plugin.json version ${version}"
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches plugin.json ${version}"

  evals:
    name: Eval harness (static — no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck evals/run.sh
        run: shellcheck evals/run.sh

      - name: Every scenario is well-formed
        run: ./evals/run.sh --lint
